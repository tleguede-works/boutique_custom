<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<style>
		@page { size: A4; margin: 10mm; }
		body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; }
		.label-sheet {
			display: grid;
			grid-template-columns: repeat({{ columns }}, 1fr);
			gap: 4mm;
			width: 100%;
		}
		.label-cell {
			border: 1px dashed #bbb;
			border-radius: 2mm;
			padding: 3mm;
			box-sizing: border-box;
			min-height: 38mm;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: space-between;
			page-break-inside: avoid;
			overflow: hidden;
		}
		.label-cell .product-image {
			max-height: 22mm;
			max-width: 100%;
			object-fit: contain;
		}
		.label-cell .placeholder {
			height: 22mm;
			width: 100%;
			background: #f5f5f5;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 7pt;
			color: #999;
		}
		.label-cell .item-name {
			font-size: 8pt;
			font-weight: bold;
			text-align: center;
			line-height: 1.2;
			margin: 1mm 0;
			max-height: 10mm;
			overflow: hidden;
		}
		.label-cell .barcode-wrap {
			width: 100%;
			text-align: center;
		}
		.label-cell .barcode-wrap svg {
			max-width: 100%;
			height: auto;
			max-height: 14mm;
		}
		.label-cell .barcode-text {
			font-size: 6pt;
			font-family: monospace;
			margin-top: 1mm;
		}
	</style>
</head>
<body>
	<div class="label-sheet">
		{% for item in items %}
		<div class="label-cell">
			{% if item.image_url %}
			<img class="product-image" src="{{ item.image_url }}" alt="">
			{% else %}
			<div class="placeholder">{{ _("Pas d'image") }}</div>
			{% endif %}
			<div class="item-name">{{ item.item_name }}</div>
			<div class="barcode-wrap">
				{{ item.barcode_svg | safe }}
				<div class="barcode-text">{{ item.barcode_value }}</div>
			</div>
		</div>
		{% endfor %}
	</div>
</body>
</html>
